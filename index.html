<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сап/Байдарка Бинго</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(160deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: #e0f7fa;
        }

        .bingo-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            max-width: 420px;
            width: 100%;
        }

        .bingo-cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.65rem;
            line-height: 1.2;
            padding: 6px;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
            color: rgba(255, 255, 255, 0.7);
        }

        .bingo-cell:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(76, 201, 240, 0.4);
        }

        .bingo-cell.checked {
            background: rgba(76, 201, 240, 0.25);
            border-color: #4cc9f0;
            color: #fff;
            box-shadow: 0 0 15px rgba(76, 201, 240, 0.2);
        }

        .bingo-cell.free {
            background: rgba(247, 37, 133, 0.15);
            border-color: rgba(247, 37, 133, 0.4);
            color: #ff8fab;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .bingo-cell.free.checked {
            background: rgba(247, 37, 133, 0.3);
            box-shadow: 0 0 15px rgba(247, 37, 133, 0.3);
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .bingo-cell.pop { animation: pop 0.25s ease; }

        .reset-btn {
            margin-top: 24px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.3s;
        }

        .reset-btn:hover {
            border-color: rgba(255, 107, 107, 0.5);
            color: #ff6b6b;
        }

        .bingo-win {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1000;
        }

        .confetti {
            position: absolute;
            width: 8px; height: 8px;
            border-radius: 2px;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        @media (max-width: 450px) {
            .bingo-board { gap: 4px; }
            .bingo-cell { font-size: 0.55rem; padding: 4px; border-radius: 6px; }
        }
    </style>
</head>
<body>
    <div class="bingo-board" id="board"></div>
    <button class="reset-btn" id="resetBtn">Сбросить</button>
    <div class="bingo-win" id="confettiContainer"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDr3pRafzwRUoNzf7wAHgbS9X5Uthg69fc",
            authDomain: "test-cdfe4.firebaseapp.com",
            databaseURL: "https://test-cdfe4-default-rtdb.firebaseio.com",
            projectId: "test-cdfe4",
            storageBucket: "test-cdfe4.firebasestorage.app",
            messagingSenderId: "450239160749",
            appId: "1:450239160749:web:40f0b0644d540884d98124",
            measurementId: "G-PR0K3S3S06"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const bingoRef = ref(db, 'bingo_cells');

        const bingoData = [
            "Перевернулся", "Потерял весло", "Фото заката", "Встретил уток", "Надел спасжилет",
            "Пил из бутылки", "Грёб против течения", "Удар веслом о камень", "Попал под дождь", "Залил телефон",
            "Увидел рыбу", "Селфи на сапе", "FREE 🏕️", "Потерял обувь", "Помог новичку",
            "Красивый привал", "Ел на воде", "Стоял на коленях", "Полная тишина", "Проплыл под мостом",
            "Обгорел на солнце", "Потерял заглушку весла", "Заметил бобра", "Финиш маршрута", "Хочу ещё раз"
        ];

        const board = document.getElementById('board');
        const resetBtn = document.getElementById('resetBtn');
        const confettiContainer = document.getElementById('confettiContainer');
        let cellStates = {};

        function createBoard() {
            board.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'bingo-cell';
                cell.dataset.index = i;
                cell.textContent = bingoData[i];

                if (i === 12) {
                    cell.classList.add('free', 'checked');
                    cellStates[i] = true;
                }

                cell.addEventListener('click', () => toggleCell(i));
                board.appendChild(cell);
            }
        }

        function toggleCell(index) {
            if (index === 12) return;
            const newState = !cellStates[index];
            cellStates[index] = newState;
            set(ref(db, `bingo_cells/${index}`), newState);
            
            const cell = board.children[index];
            cell.classList.add('pop');
            setTimeout(() => cell.classList.remove('pop'), 250);
        }

        function updateUI(data) {
            const cells = board.querySelectorAll('.bingo-cell');
            for (let i = 0; i < 25; i++) {
                if (i === 12) continue;
                const isChecked = data && data[i.toString()] === true;
                cellStates[i] = isChecked;
                isChecked ? cells[i].classList.add('checked') : cells[i].classList.remove('checked');
            }
            checkBingo();
        }

        function checkBingo() {
            const grid = Array.from({length: 25}, (_, i) => cellStates[i] || false);
            let won = false;

            for (let r = 0; r < 5; r++) {
                if (grid[r*5] && grid[r*5+1] && grid[r*5+2] && grid[r*5+3] && grid[r*5+4]) won = true;
            }
            for (let c = 0; c < 5; c++) {
                if (grid[c] && grid[c+5] && grid[c+10] && grid[c+15] && grid[c+20]) won = true;
            }
            if (grid[0] && grid[6] && grid[12] && grid[18] && grid[24]) won = true;
            if (grid[4] && grid[8] && grid[12] && grid[16] && grid[20]) won = true;

            if (won) launchConfetti();
        }

        function launchConfetti() {
            const colors = ['#4cc9f0', '#4895ef', '#4361ee', '#f72585', '#ffd700', '#51cf66'];
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
                    confettiContainer.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 25);
            }
        }

        resetBtn.addEventListener('click', () => {
            if (confirm('Сбросить все отметки?')) remove(bingoRef);
        });

        onValue(bingoRef, (snapshot) => updateUI(snapshot.val()));
        createBoard();
    </script>
</body>
</html>
