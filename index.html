<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сап/Байдарка Бинго</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(160deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: #e0f7fa;
        }

        .bingo-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            max-width: 420px;
            width: 100%;
        }

        .bingo-cell {
            position: relative;
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.65rem;
            line-height: 1.2;
            padding: 6px;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
            color: rgba(255, 255, 255, 0.7);
        }

        .bingo-cell:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(76, 201, 240, 0.4);
        }

        .bingo-cell.checked {
            background: rgba(255, 42, 42, 0.08);
            border-color: rgba(255, 42, 42, 0.3);
        }

        /* Красный крест поверх текста */
        .bingo-cell.checked::after {
            content: '✕';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.5rem;
            color: #ff2a2a;
            font-weight: 900;
            pointer-events: none;
            text-shadow: 0 0 12px rgba(255, 42, 42, 0.5);
            z-index: 5;
            line-height: 1;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .bingo-cell.pop { animation: pop 0.25s ease; }

        .reset-btn {
            margin-top: 24px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.3s;
        }

        .reset-btn:hover {
            border-color: rgba(255, 107, 107, 0.5);
            color: #ff6b6b;
        }

        @media (max-width: 450px) {
            .bingo-board { gap: 4px; }
            .bingo-cell { font-size: 0.55rem; padding: 4px; border-radius: 6px; }
            .bingo-cell.checked::after { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <div class="bingo-board" id="board"></div>
    <button class="reset-btn" id="resetBtn">Сбросить</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDr3pRafzwRUoNzf7wAHgbS9X5Uthg69fc",
            authDomain: "test-cdfe4.firebaseapp.com",
            databaseURL: "https://test-cdfe4-default-rtdb.firebaseio.com",
            projectId: "test-cdfe4",
            storageBucket: "test-cdfe4.firebasestorage.app",
            messagingSenderId: "450239160749",
            appId: "1:450239160749:web:40f0b0644d540884d98124",
            measurementId: "G-PR0K3S3S06"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const bingoRef = ref(db, 'bingo_cells');

        const bingoData = [
            "Перевернулся", "Потерял весло", "Фото заката", "Встретил уток", "Надел спасжилет",
            "Пил из бутылки", "Грёб против течения", "Удар веслом о камень", "Попал под дождь", "Залил телефон",
            "Увидел рыбу", "Селфи на сапе", "БИНГО", "Потерял обувь", "Помог новичку",
            "Красивый привал", "Ел на воде", "Стоял на коленях", "Полная тишина", "Проплыл под мостом",
            "Обгорел на солнце", "Потерял заглушку", "Заметил бобра", "Финиш маршрута", "Хочу ещё раз"
        ];

        const board = document.getElementById('board');
        const resetBtn = document.getElementById('resetBtn');
        let cellStates = {};

        function createBoard() {
            board.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'bingo-cell';
                cell.dataset.index = i;
                cell.textContent = bingoData[i];
                
                // Все клетки изначально неактивны, включая центр
                cellStates[i] = false;

                cell.addEventListener('click', () => toggleCell(i));
                board.appendChild(cell);
            }
        }

        function toggleCell(index) {
            const newState = !cellStates[index];
            cellStates[index] = newState;
            set(ref(db, `bingo_cells/${index}`), newState);
            
            const cell = board.children[index];
            cell.classList.add('pop');
            setTimeout(() => cell.classList.remove('pop'), 250);
        }

        function updateUI(data) {
            const cells = board.querySelectorAll('.bingo-cell');
            for (let i = 0; i < 25; i++) {
                const isChecked = data && data[i.toString()] === true;
                cellStates[i] = isChecked;
                
                if (isChecked) {
                    cells[i].classList.add('checked');
                } else {
                    cells[i].classList.remove('checked');
                }
            }
        }

        resetBtn.addEventListener('click', () => {
            if (confirm('Сбросить все отметки?')) {
                remove(bingoRef);
            }
        });

        onValue(bingoRef, (snapshot) => updateUI(snapshot.val()));
        createBoard();
    </script>
</body>
</html>
